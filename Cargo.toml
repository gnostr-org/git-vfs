[package]
name = "git-vfs"
version = "0.2.0"
edition = "2024"

[dependencies]
async-std = { version = "1.12", features = ["async-channel", "attributes"] }

# --- LibP2P Networking Stack ---
async-trait = "0.1.80"
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2.9.0"
futures = "0.3"
hex = { version = "0.4.3", features = ["serde"] }
libp2p = { version = "0.53", features = ["tokio", "kad", "request-response", "mdns", "macros", "yamux", "tcp", "identify", "noise"] }
libp2p-core = "0.43.1"
libp2p-noise = "0.46.1"
libp2p-yamux = "0.45.2"

# --- Git2 Dependency ---
git2 = "0.18.3"

# --- Your Existing Dependencies ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10.9", features = ["oid"] }
tokio = { version = "1.38", features = ["full"] }
vfs = { version = "0.12.2", features = ["tokio", "async-vfs", "futures"] }
